name: Build Trading Journey Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project structure
        run: |
          mkdir -p app/src/main/java/com/raajat/tradingjourney
          mkdir -p app/src/main/res/values

          cp index.html app/src/main/assets/index.html 2>/dev/null || true
          cp MainActivity.java app/src/main/java/com/raajat/tradingjourney/MainActivity.java
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp styles.xml app/src/main/res/values/styles.xml

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.raajat.tradingjourney'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.raajat.tradingjourney'
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName '3.0'
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trading-Journey-Pro-V3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
